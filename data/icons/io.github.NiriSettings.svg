<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Palette: Noctalia default (dark) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a45"/>
      <stop offset="1" stop-color="#070722"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a9aefe" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a9aefe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- squircle background -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#sky)"/>
  <rect x="6.75" y="6.75" width="114.5" height="114.5" rx="29.25" fill="none" stroke="#21215f" stroke-width="1.5"/>

  <!-- sparkles -->
  <path fill="#9bfece" d="M22 24 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5z"/>
  <path fill="#9bfece" opacity="0.8" d="M106 30 l1.1 3 3 1.1 -3 1.1 -1.1 3 -1.1 -3 -3 -1.1 3 -1.1z"/>
  <circle cx="104" cy="56" r="1.5" fill="#a9aefe"/>
  <circle cx="22" cy="56" r="1.3" fill="#a9aefe" opacity="0.8"/>

  <!-- cog buddy -->
  <circle cx="64" cy="50" r="40" fill="url(#glow)"/>
  <g transform="translate(64 50)">
    <g fill="#a9aefe">
      <rect x="-7" y="-35" width="14" height="70" rx="2.5"/>
      <rect x="-7" y="-35" width="14" height="70" rx="2.5" transform="rotate(45)"/>
      <rect x="-7" y="-35" width="14" height="70" rx="2.5" transform="rotate(90)"/>
      <rect x="-7" y="-35" width="14" height="70" rx="2.5" transform="rotate(135)"/>
      <circle r="28"/>
    </g>
    <!-- inner ring so it reads as a cog -->
    <circle r="19" fill="#c3c7ff"/>
    <circle r="19" fill="none" stroke="#8f95f0" stroke-width="2"/>
    <!-- face -->
    <g fill="none" stroke="#070722" stroke-width="2.6" stroke-linecap="round">
      <path d="M-10 -3 q3.5 -4 7 0"/>
      <path d="M3 -3 q3.5 -4 7 0"/>
      <path d="M-3.5 4 q3.5 3.5 7 0"/>
    </g>
    <ellipse cx="-11" cy="4" rx="3.2" ry="2" fill="#fd4663" opacity="0.5"/>
    <ellipse cx="11"  cy="4" rx="3.2" ry="2" fill="#fd4663" opacity="0.5"/>
  </g>

  <!-- sliders -->
  <rect x="26" y="95" width="76" height="6" rx="3" fill="#21215f"/>
  <rect x="26" y="95" width="48" height="6" rx="3" fill="#9bfece"/>
  <circle cx="74" cy="98" r="6" fill="#f3edf7"/>
  <rect x="26" y="108" width="76" height="6" rx="3" fill="#21215f"/>
  <rect x="26" y="108" width="24" height="6" rx="3" fill="#c3c7ff"/>
  <circle cx="50" cy="111" r="6" fill="#f3edf7"/>
</svg>
